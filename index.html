<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INFINIX RUSH</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#0a0a12;color:white;font-family:Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh}
  h1{font-size:28px;letter-spacing:2px;margin:10px 0 2px}
  h1 span{color:#00e676}
  p{font-size:13px;color:#aaa;margin-bottom:8px}
  #gameBox{position:relative;width:95vw;max-width:480px;height:62vh;max-height:420px;background:linear-gradient(#1a1a2e,#0a0a12);border:2px solid #00e676;border-radius:16px;overflow:hidden}
  canvas{width:100%;height:100%;display:block}
  #scoreBar{display:flex;justify-content:space-between;width:95vw;max-width:480px;padding:8px 4px;font-weight:bold;font-size:16px}
  #scoreBar span:last-child{color:#ffca28}
  #level{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#ff1744;color:white;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;display:none}
  #overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  #overlay h2{font-size:26px;margin-bottom:6px}
  #overlay p{font-size:14px;color:#ccc;margin:4px 0}
  button{background:#00e676;border:none;color:#000;font-weight:bold;font-size:18px;padding:14px 28px;border-radius:30px;margin-top:14px;cursor:pointer}
  button:active{transform:scale(.95)}
  #tapHint{font-size:12px;color:#888;margin-top:10px}
</style>
</head>
<body>
<h1>INFINIX <span>RUSH</span></h1>
<p>Tap to jump • Dodge the red blocks</p>
<div id="scoreBar"><span>Score: <span id="score">0</span></span><span>🏆 Best: <span id="best">0</span></span></div>
<div id="gameBox">
  <canvas id="c" width="480" height="420"></canvas>
  <div id="level">🔥 LEVEL 2 - HARD MODE!</div>
  <div id="overlay">
    <h2 id="oTitle">READY?</h2>
    <p id="oText">Best score saves automatically!<br>Reach 100 to unlock HARD MODE</p>
    <button id="startBtn">▶ PLAY</button>
    <div id="tapHint">Tip: Turn your sound ON 🔊</div>
  </div>
</div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const oTitle=document.getElementById('oTitle');
const oText=document.getElementById('oText');
const startBtn=document.getElementById('startBtn');
const levelEl=document.getElementById('level');

let best = parseInt(localStorage.getItem('infinix_best')||'0');
bestEl.textContent=best;

let player, obstacles, score, speed, gravity, gameOver, playing, frame, spawnTimer, hardMode=false;
let audioCtx=null;

function initAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function beep(freq,dur,type='square',vol=0.15){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.value=vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+dur);
}
function playJump(){ beep(500,0.12,'square',0.12); }
function playPoint(){ beep(900,0.08,'sine',0.15); setTimeout(()=>beep(1200,0.08,'sine',0.15),70); }
function playDie(){ beep(300,0.15,'sawtooth',0.2); setTimeout(()=>beep(150,0.3,'sawtooth',0.2),120); }
function playLevelUp(){ [600,800,1000,1300].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.15),i*90)); }

function reset(){
  player={x:60,y:300,w:38,h:48,vy:0,jumping:false};
  obstacles=[]; score=0; speed=4.2; gravity=0.85; gameOver=false; frame=0; spawnTimer=0; hardMode=false;
  levelEl.style.display='none';
  scoreEl.textContent='0';
}

function start(){
  initAudio();
  reset(); playing=true; overlay.style.display='none';
  requestAnimationFrame(loop);
}

function jump(){
  if(!playing) return;
  if(!player.jumping){ player.vy=-14.5; player.jumping=true; playJump(); }
}

function spawn(){
  const h = 30 + Math.random()*40;
  obstacles.push({x:480,w:28+Math.random()*12,h:h,y:348-h});
}

function loop(){
  if(!playing) return;
  frame++;
  // physics
  player.vy+=gravity; player.y+=player.vy;
  if(player.y>=300){ player.y=300; player.vy=0; player.jumping=false; }

  // spawn obstacles
  spawnTimer--;
  let gap = hardMode ? 55 : 85;
  if(spawnTimer<=0){ spawn(); spawnTimer=gap+Math.random()*40; }

  // move + score
  for(let o of obstacles){ o.x-=speed; }
  if(obstacles.length && obstacles[0].x+obstacles[0].w<player.x && !obstacles[0].passed){
    obstacles[0].passed=true; score+=10; scoreEl.textContent=score; playPoint();
    if(score>=100 && !hardMode){ hardMode=true; speed=7.2; levelEl.style.display='block'; playLevelUp(); setTimeout(()=>levelEl.style.display='none',2500); }
    else if(score>0 && score%50===0){ speed+=0.3; }
  }
  obstacles=obstacles.filter(o=>o.x>-50);

  // collision
  for(let o of obstacles){
    if(player.x<o.x+o.w && player.x+player.w>o.x && player.y<o.y+o.h && player.y+player.h>o.y){
      die(); return;
    }
  }

  draw();
  requestAnimationFrame(loop);
}

function draw(){
  ctx.clearRect(0,0,480,420);
  // ground
  ctx.fillStyle='#00e676'; ctx.fillRect(0,348,480,4);
  ctx.fillStyle='#222'; ctx.fillRect(0,352,480,68);
  // player - green Infinix phone guy
  ctx.fillStyle= hardMode ? '#ffca28' : '#00e676';
  ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#000'; ctx.fillRect(player.x+8,player.y+10,8,8); ctx.fillRect(player.x+22,player.y+10,8,8);
  ctx.fillStyle='#fff'; ctx.fillRect(player.x+10,player.y+30,18,4);
  // obstacles
  ctx.fillStyle='#ff1744';
  for(let o of obstacles){ ctx.fillRect(o.x,o.y,o.w,o.h); ctx.fillStyle='#fff'; ctx.fillRect(o.x+5,o.y+8,o.w-10,6); ctx.fillStyle='#ff1744'; }
  // speed lines if hard
  if(hardMode){ ctx.strokeStyle='rgba(255,255,255,0.2)'; for(let i=0;i<3;i++){ let y=60+i*80; ctx.beginPath(); ctx.moveTo(480-((frame*2+i*100)%500),y); ctx.lineTo(480-((frame*2+i*100)%500)+40,y); ctx.stroke(); } }
}

function die(){
  playing=false; gameOver=true; playDie();
  if(score>best){ best=score; localStorage.setItem('infinix_best',best); bestEl.textContent=best; }
  oTitle.textContent='💥 GAME OVER';
  oText.innerHTML=`Score: <b style="color:#00e676">${score}</b><br>Best: <b style="color:#ffca28">${best}</b><br>${score>=100?'You reached HARD MODE! 🔥':'Reach 100 to unlock HARD MODE!'}`;
  startBtn.textContent='🔄 PLAY AGAIN';
  overlay.style.display='flex';
}

startBtn.addEventListener('click',start);
document.getElementById('gameBox').addEventListener('touchstart',e=>{ if(e.target.closest('button')) return; e.preventDefault(); initAudio(); if(playing) jump(); },{passive:false});
document.getElementById('gameBox').addEventListener('mousedown',()=>{initAudio(); if(playing) jump();});
document.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault(); initAudio(); if(playing) jump(); }});
</script>
</body>
 </html>
