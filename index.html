<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INFINIX RUSH - Play & Win</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;font-family:Arial,sans-serif;color:#fff;overflow:hidden}
#wrap{max-width:480px;margin:0 auto;height:100vh;height:100dvh;position:relative;background:linear-gradient(#0a0a2e,#000);display:flex;flex-direction:column}
header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#111;border-bottom:2px solid #00ff88}
header b{font-size:20px;letter-spacing:1px}
header b span{color:#00ff88}
#scoreBox{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-weight:900}
#gameArea{flex:1;position:relative;overflow:hidden;background:linear-gradient(#1a1aff,#00c6ff)}
#road{position:absolute;bottom:0;left:0;width:100%;height:95px;background:#222;border-top:4px dashed #fff}
#player{position:absolute;bottom:95px;left:30px;width:55px;height:75px;font-size:48px;transition:bottom .18s;z-index:5}
#player.jump{bottom:210px}
.obj{position:absolute;bottom:95px;font-size:38px;z-index:4}
.coin{position:absolute;bottom:160px;font-size:30px;z-index:3}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}
.pill{background:rgba(0,0,0,.7);padding:6px 12px;border-radius:20px;font-weight:800;font-size:13px;border:1px solid #00ff88}
#tapBtn{position:absolute;bottom:125px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;border:none;padding:14px 28px;border-radius:30px;font-weight:900;font-size:16px;z-index:20;box-shadow:0 5px 0 #00994d}
#over{position:absolute;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:30}
#over h2{font-size:32px;color:#00ff88}
.btn{background:#00ff88;color:#000;border:none;padding:13px 22px;border-radius:25px;font-weight:900;font-size:16px;margin:6px;width:90%;max-width:300px}
.btn2{background:#fff;color:#000}
footer{padding:10px;background:#111;text-align:center;border-top:2px solid #00ff88}
.opay{background:#fff;color:#000;margin:8px 14px;padding:10px;border-radius:12px;text-align:center}
.opay b{font-size:20px;letter-spacing:1px;color:#000}
.opay span{color:#6a00ff;font-weight:900}
.copyBtn{background:#6a00ff;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:800;margin-top:6px}
</style>
</head>
<body>
<div id="wrap">
<header><b>INFINIX <span>RUSH</span> 📱</b><div id="scoreBox">SCORE: <span id="score">0</span></div></header>
<div id="gameArea">
<div id="hud"><div class="pill">❤️ <span id="lives">3</span> Lives</div><div class="pill">📱 <span id="phones">0</span> Phones</div></div>
<div id="player">🏃‍♂️</div>
<div id="road"></div>
<button id="tapBtn">TAP TO JUMP ⬆️</button>
<div id="over">
<h2>GAME OVER!</h2>
<p>You collected <b id="finalPhones" style="color:#00ff88">0</b> Infinix Phones</p>
<p>Score: <b id="finalScore">0</b></p>
<button class="btn" onclick="startGame()">▶️ PLAY AGAIN</button>
<button class="btn btn2" onclick="shareGame()">📤 SHARE GAME</button>
</div>
</div>
<div class="opay">
<div style="font-size:13px">💜 SUPPORT / TOP-UP WITH OPAY</div>
<b>8065863879</b><br><span>Great-bit203 - INFINIX RUSH</span><br>
<button class="copyBtn" onclick="copyOpay()">Copy Opay Number</button>
<div style="font-size:12px;margin-top:5px;color:#666">Send any amount to play more • Screenshot & send to unlock bonus</div>
</div>
<footer>Tap to Jump • Collect 📱 • Avoid 🚧 • Made for Infinix Fans</footer>
</div>
<script>
let score=0, phones=0, lives=3, playing=false, speed=4, gameTimer, spawnTimer;
let player=document.getElementById('player');
let area=document.getElementById('gameArea');
function startGame(){
 score=0; phones=0; lives=3; speed=4; playing=true;
 document.getElementById('score').innerText=0;
 document.getElementById('phones').innerText=0;
 document.getElementById('lives').innerText=3;
 document.getElementById('over').style.display='none';
 document.querySelectorAll('.obj,.coin').forEach(e=>e.remove());
 clearInterval(gameTimer); clearInterval(spawnTimer);
 gameTimer=setInterval(moveObjects,20);
 spawnTimer=setInterval(spawn,900);
}
function jump(){
 if(!playing) startGame();
 player.classList.add('jump');
 setTimeout(()=>player.classList.remove('jump'),380);
}
document.getElementById('tapBtn').addEventListener('click',jump);
area.addEventListener('click', (e)=>{ if(e.target.id!=='tapBtn') jump(); });
function spawn(){
 if(!playing) return;
 let isCoin = Math.random()>0.45;
 let el=document.createElement('div');
 el.className = isCoin ? 'coin' : 'obj';
 el.innerText = isCoin ? '📱' : ['🚧','🪨','🚗','🔥'][Math.floor(Math.random()*4)];
 el.style.left = '100%';
 if(isCoin) el.style.bottom = (Math.random()>0.5?160:100)+'px';
 area.appendChild(el);
}
function moveObjects(){
 if(!playing) return;
 let objs=document.querySelectorAll('.obj,.coin');
 objs.forEach(el=>{
  let cur = el.offsetLeft;
  cur -= speed;
  el.style.left = cur+'px';
  if(cur < -60){ el.remove(); return; }
  let pRect = player.getBoundingClientRect();
  let eRect = el.getBoundingClientRect();
  if(!(pRect.right < eRect.left || pRect.left > eRect.right || pRect.bottom < eRect.top || pRect.top > eRect.bottom)){
   if(el.className==='coin'){
    phones++; score+=50;
    document.getElementById('phones').innerText=phones;
    document.getElementById('score').innerText=score;
    el.remove();
   } else {
    lives--;
    document.getElementById('lives').innerText=lives;
    el.remove();
    if(lives<=0) gameOver();
   }
  }
 });
 score+=1;
 if(score%200===0) speed+=0.3;
 document.getElementById('score').innerText=score;
}
function gameOver(){
 playing=false;
 clearInterval(gameTimer); clearInterval(spawnTimer);
 document.getElementById('finalPhones').innerText=phones;
 document.getElementById('finalScore').innerText=score;
 document.getElementById('over').style.display='flex';
}
function copyOpay(){ navigator.clipboard.writeText('8065863879'); alert('Opay number copied: 8065863879'); }
function shareGame(){
 let txt=`I just scored ${score} in INFINIX RUSH! Can you beat me?`;
 if(navigator.share) navigator.share({text:txt});
 else { navigator.clipboard.writeText(txt); alert('Copied!'); }
}
startGame();
</script>
</body>
                                            </html>
